# ZeroTier libzt global route module
enabled=true
interface=zt0
route_mode=managed
rule_priority=auto
routing_table=51820
mtu=1400

# 16 hexadecimal characters. Leave empty until configured.
network_id=
# Optional custom overrides. A fresh install leaves both files absent so
# libzt uses the official Planet embedded in ZeroTier core.
planet_path=/data/adb/zt-global/planet
roots_path=/data/adb/zt-global/roots
storage_path=/data/adb/zt-global/state
port=0

auto_start=true
auto_reconnect=true
ipv4=true
ipv6=true

# Optional list of underlay endpoints to keep in the main table in full-tunnel mode.
# This is intentionally unused by the default managed-route mode.
underlay_exclude=
